彼女が人の子（人間）との間に産んだこれらの（悪霊である）子供たちは人間の女性たちの前に現れる。
そして女性たちは彼ら（悪霊たち）によって身籠みごもる。彼女らは悪霊を産み、彼ら（子である悪霊たち）はみな原初のリリスの<ruby>下<rt>もと</rt></ruby>へ行く。そしてリリスは彼らを育てる。彼女（リリス）は世界に出て子供たちを求め、人間の子供を見、彼らを殺すために彼らと結び付き、人間の子供たちの霊たちに取り<ruby>憑<rt>つ</rt></ruby>き、彼女はこの霊を連れ去った。そしてそこに3つの聖なる霊が召喚された。それらは彼女の前に飛んで行き、彼らは彼女からこの霊を遠ざけ、それを神の下に導き、彼らはそこで彼の<ruby>御前<rt>ごぜん</rt></ruby>で教えを授かる。
